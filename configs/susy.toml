[path]
data = "../data/splits/susy/"
model = "../artifacts/forest/susy/"
memory_profile = "../results/benchmarks/susy/memory/"
prediction = "../artifacts/predictions/susy/"

[name]
profile_label = "SUSY Training Memory Benchmark"
profile_filename = "susy_memory_report.txt"

[random_forest]
cc_indices = [] #> `.toml` cannot take `None` as value.
trees_max_depth = 300
bootstrap_balance = "auto"
criterion = "hellinger"
random_state = 42
n_jobs = 8

[iterable_config]
n_trees = [100, 120, 140, 160]
min_leaf_purity = [0.96, 0.97, 0.98, 0.99]
min_samples_split = [10, 15, 20, 25]
min_samples_leaf = [10, 15, 20, 25]